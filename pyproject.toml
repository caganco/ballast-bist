[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballast-bist"
version = "0.2.0"
description = "Systematic BIST portfolio maintenance toolkit - band rebalancing, transaction-cost modelling, and low-variance volatility calibration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.3.0",
    "pandas==2.2.2",
    "numpy>=1.26",
    "pyarrow==16.1.0",
    "PyYAML==6.0.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
include = ["ballast*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length governed by formatter, not lint

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
# Gradual adoption: the calibration + portfolio surface is type-checked;
# legacy data/ ingestion modules are onboarded incrementally.
files = ["ballast/costs", "ballast/portfolio"]
